name: 'Devolutions Server Login'
description: 'Authenticate and get a token from Devolutions Server'
inputs:
  server_url:
    description: 'URL of the Devolutions Server'
    required: true
  app_key:
    description: 'Application key for authentication'
    required: true
  app_secret:
    description: 'Application secret for authentication'
    required: true
  output_variable:
    description: 'Name of the environment variable to store the retrieved token'
    required: false
    default: 'DVLS_TOKEN'
  skip_tls_verify:
    description: 'Disable TLS certificate verification. Insecure: only use for testing with self-signed certificates. Prefer NODE_EXTRA_CA_CERTS to trust a private CA.'
    required: false
    default: 'false'
runs:
  using: 'node20'
  main: 'dist/index.js'